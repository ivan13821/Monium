[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monium-sdk"
version = "0.1.1"
description = "Описание вашей утилиты"
readme = "README.md"
authors = [
    {name = "ivan13821", email = "safarovi670@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8"
dependencies = [
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.3",
    "aiosignal>=1.4.0",
    "attrs>=26.1.0",
    "certifi>=2026.7.22",
    "cffi>=2.1.1",
    "charset-normalizer>=3.5.1",
    "cryptography>=50.0.1",
    "Deprecated>=1.3.1",
    "frozenlist>=1.8.0",
    "googleapis-common-protos>=1.75.2",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.81.1",
    "idna>=3.19",
    "multidict>=6.7.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-exporter-otlp-proto-common>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-proto>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-semantic-conventions>=0.65b0",
    "propcache>=0.5.2",
    "protobuf>=6.33.6",
    "pycparser>=3.0",
    "PyJWT>=2.13.0",
    "requests>=2.34.2",
    "setuptools>=84.0.0",
    "six>=1.17.0",
    "typing_extensions>=4.16.0",
    "urllib3>=2.7.0",
    "wrapt>=2.3.0",
    "yandexcloud>=0.404.0",
    "yarl>=1.24.5",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/ivan13821/Monium"
Repository = "https://github.com/ivan13821/Monium"